<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>TikTok Authorization | Mahligai Seni</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/brand/favicon.png">
  <style>
    body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background: #f6f1e8; color: #241d18; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 20px; }
    img { height: 46px; width: auto; }
    h1 { font-size: 1.5rem; margin: 28px 0 8px; }
    p { line-height: 1.6; color: #62564b; }
    .box { background: #fffdf8; border: 1px solid #dacdb6; border-radius: 12px; padding: 16px; margin: 20px 0; }
    code { display: block; word-break: break-all; font-size: .95rem; color: #241d18; }
    button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 999px; background: #2b221c; color: #fff; font-weight: 600; cursor: pointer; }
    .err { color: #9a3322; }
  </style>
</head>
<body>
  <main>
    <a href="./"><img src="assets/brand/logo-dark.png" width="461" height="199" alt="Mahligai Seni"></a>
    <h1 id="title">TikTok authorization</h1>
    <p id="msg">This page receives the TikTok for Business authorization for the internal reporting tool of SYNAPSIS ENTERPRISE (Mahligai Seni). No data is stored on this page.</p>
    <div class="box" id="box" hidden>
      <p>Authorization code (valid for a short time, single use):</p>
      <code id="code"></code>
      <button type="button" id="copy">Copy code</button>
    </div>
    <p><a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms</a></p>
  </main>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var code = q.get("auth_code") || q.get("code");
      var title = document.getElementById("title"), msg = document.getElementById("msg");
      if (code) {
        title.textContent = "Authorization received";
        msg.textContent = "Copy the code below into the reporting tool to finish connecting the TikTok ad account.";
        document.getElementById("code").textContent = code;
        document.getElementById("box").hidden = false;
        document.getElementById("copy").onclick = function () {
          navigator.clipboard && navigator.clipboard.writeText(code).then(function () {
            document.getElementById("copy").textContent = "Copied";
          });
        };
        // Keep the code out of browser history once shown
        history.replaceState(null, "", location.pathname);
      } else if (q.get("error")) {
        title.textContent = "Authorization not completed";
        msg.className = "err";
        msg.textContent = "TikTok returned: " + q.get("error");
      }
    })();
  </script>
</body>
</html>
